<!DOCTYPE html>
<html lang="sk">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width">
	<title>Databázy a internet</title>
	<link rel="stylesheet" href="stylesheet.css">
	<link rel="stylesheet" href="formular_zadanie.css">
	<link rel="icon" type="image/x-icon" href="IMG/logo_sjf.png">
	<script src="app.js" defer></script>
    <script src="formular_zadanie.js" defer></script>

</head>
<body>
	<main class="page-shell">
		<div class="header-inner" id="formular_div">
			<h1 id="nazov_stranky">Nadpis</h1>
                <form action="" method="post" id="formular">
                    <label for="name">Meno a Priezvisko:</label>
                    <input type="text" id="name" name="name" placeholder="Zadajte svoje meno a priezvisko" autofocus required>

                    <br>
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" placeholder="Zadajte svoj e-mail" required>

                    <br>
                    <label for="tel">Tel. číslo:</label>
                    <input type="tel" id="tel" name="tel" placeholder="Zadajte svoje telefónne číslo" required>

                    <br>
                    <label for="date">Dátum narodenia:</label>
                    <input type="date" id="date" name="date" value="2026-10-05" required>

                    <br>
                    <label for="kurz">Kurz:</label>
                    <select id="kurz" name="kurz">
                        <option value="HTML" selected>HTML</option>
                        <option value="CSS">CSS</option>
                        <option value="JavaScript">JavaScript</option>
                    </select>

                    <br>
                    <fieldset id="uroven" name="uroven">
                        <legend>Úroveň:</legend>
                        <label for="uroven-beginner">Beginner
                        <input type="radio" id="uroven-beginner" name="uroven" value="Beginner" checked>
                        </label>

                        <label for="uroven-intermediate">Intermediate
                        <input type="radio" id="uroven-intermediate" name="uroven" value="Intermediate">
                        </label>

                        <label for="uroven-advanced">Advanced
                        <input type="radio" id="uroven-advanced" name="uroven" value="Advanced">
                        </label>
                    </fieldset>

                    <br>
                    <label for="note" wrap="hard">Poznámka:</label>
                    <textarea id="note" name="note" placeholder="Zadajte svoju poznámku" rows="8" cols="50" maxlength="250"></textarea>

                    <br>
                    <label for="suhlas">Súhlas s podmienkami</label>
                    <input type="checkbox" id="suhlas" name="suhlas" required>

                    <br>
                    <button type="submit" id="submit" class="submit">Odoslať</button>
                </form>
        </div>
        <div class="header-inner">
                <h2>Hodnoty polí formuláru</h2>
                <table class="form-values">
                    <tbody>
                    <tr>
                        <th scope="row">Meno a priezvisko:</th>
                        <td id="name-output"></td>
                    </tr>
                    <tr>
                        <th scope="row">E-mail:</th>
                        <td id="email-output"></td>
                    </tr>
                    <tr>
                        <th scope="row">Tel. číslo:</th>
                        <td id="tel-output"></td>
                    </tr>
                    <tr>
                        <th scope="row">Dátum narodenia:</th>
                        <td id="date-output"></td>
                    </tr>
                    <tr>
                        <th scope="row">Kurz:</th>
                        <td id="kurz-output">HTML</td>
                    </tr>
                    <tr>
                        <th scope="row">Úroveň:</th>
                        <td id="uroven-output">Beginner</td>
                    </tr>
                    <tr>
                        <th scope="row">Poznámka:</th>
                        <td id="note-output"></td>
                    </tr>
                    <tr>
                        <th scope="row">Súhlas s podmienkami:</th>
                        <td id="suhlas-output"></td>
                    </tr>
                    </tbody>
                </table>
        </div>
	</main>
</body>
</html>
