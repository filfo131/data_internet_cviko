<!DOCTYPE html>
<html lang="sk">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width">
	<title>Databázy a internet</title>
	<link rel="stylesheet" href="style.css">
	<link rel="icon" type="image/x-icon" href="IMG/logo_sjf.png">
	<script src="app.js" defer></script>
</head>
<body>
	<main class="page-shell">
		<div class="header-inner">
			<h1>Zoznamy v HTML</h1>

			<h2>Neusporiadaný zoznam</h2>
			<p>Element <code>&lt;ul&gt;</code> vytvorí zoznam s odrážkami:</p>
			<ul>
				<li>HTML</li>
				<li>CSS</li>
				<li>JavaScript</li>
			</ul>

			<h2>Usporiadaný zoznam</h2>
			<p>Element <code>&lt;ol&gt;</code> vytvorí číslovaný zoznam:</p>
			<ol>
				<li>Prvý krok</li>
				<li>Druhý krok</li>
				<li>Tretí krok</li>
			</ol>
			<!-- Možnosti atribútu type pre ol: 1 (predvolené), A, a, I, i. -->
		</div>
	</main>
</body>
</html>
